# Preguntas sugeridas por dato faltante (clase C4 QUESTIONS; §9.3 y SUP-044).
# Una entrada por cada campo_dato distinto de data/publico/reglas_elegibilidad.csv.
# benefit_ids: unión regla -> data/publico/beneficios_versiones.csv -> id_beneficio, ordenada.
# La respuesta se guarda como dato declarado y el motor reevalúa: la pregunta no decide elegibilidad.
# Sin diagnósticos ni números de documentos. sin_pregunta: DATO_ADMINISTRATIVO (lo resuelve el registro
# o la institución), SE_RESUELVE_CON_OTRA_PREGUNTA (ver: indica cuál) o NO_SE_PREGUNTA_A_LA_FAMILIA.
content_version: "0.2.0"
estado: PENDIENTE_REVISION_HUMANA
fuente_vocabulario: data/publico/reglas_elegibilidad.csv#campo_dato
