    AllowedResponse:
      description: >-
        Unión cerrada derivada de C0. Cada field_id queda ligado a su tipo y allowlist exactos,
        y todo destino C2_CONTEXT se normaliza mediante x-c0-field-crosswalk de C2.
        Un campo con vocabulario PENDIENTE_VALIDACION_INTEGRA solo admite UNKNOWN hasta aprobación.
        p2.income.band representa ingreso total del hogar; no habilita ni deriva ingreso per cápita.
        Las respuestas p2.housing.camp_occupation y p2.housing.room_other_home se conservan como hechos separados; HOUSING-TYPE-V1 deriva housing.type con la tabla cerrada de C2 y produce valor nulo/estado DESCONOCIDO ante conflicto, doble falso o ausencia.
      oneOf:
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id:
              type: string
              enum: [p1.nee.possible_disability, p1.nee.certificate_present, p1.household.day_caregiver, p1.mother.formal_employment, p1.mother.household_head_signal, p1.mother.disability_flag, p1.father.formal_employment, p1.father.household_head_signal, p1.father.disability_flag, p1.guardian.formal_employment, p1.guardian.household_head_signal, p1.guardian.disability_flag, p2.mother.household_head_continuation, p2.father.household_head_continuation, p2.guardian.household_head_continuation, p2.rsh.has_registry, p2.housing.camp_occupation, p2.housing.room_other_home, p2.housing.water_difficulty, p3.nee.flag, p3.nee.certificate_present, p3.health.pregnancy_flag]
            response: {$ref: '#/components/schemas/BooleanAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id: {type: string, enum: [p1.child.age, p1.mother.age, p1.father.age, p1.guardian.age]}
            response: {$ref: '#/components/schemas/AgeAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id: {type: string, enum: [p1.siblings.under_6, p1.siblings.6_14, p1.siblings.15_18, p2.housing.bedroom_count]}
            response: {$ref: '#/components/schemas/CountAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id: {const: p2.priority.cse_score}
            response: {$ref: '#/components/schemas/CseScoreAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id: {type: string, enum: [p1.mother.education_format_signal, p1.father.education_format_signal, p1.guardian.education_format_signal]}
            response: {$ref: '#/components/schemas/PreferredFormatAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id: {const: p2.rsh.band}
            response: {$ref: '#/components/schemas/RshBandAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id: {const: p2.income.band}
            response: {$ref: '#/components/schemas/HouseholdIncomeBandAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id:
              type: string
              enum: [p1.child.health_coverage_band, p1.priority.institutional_signal, p1.mother.sex_signal, p1.father.sex_signal, p1.guardian.sex_signal, p2.housing.serviu_status, p2.housing.tenure, p2.housing.sanitation, p2.housing.electricity, p2.benefits.access_flags, p3.coverage.health_band]
            response: {$ref: '#/components/schemas/UnknownAnswer'}
        - type: object
          additionalProperties: false
          required: [field_id, response]
          properties:
            field_id: {type: string, enum: [p1.household.roles_ages, p2.household.roles_ages]}
            response: {$ref: '#/components/schemas/CompositionAnswer'}
