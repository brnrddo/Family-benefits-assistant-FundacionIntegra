openapi: 3.1.0
info:
  title: Brújula Familiar API
  version: 2.0.0
  description: >-
    Contrato documental C3 migrado in-place por DEC-023. No prueba que exista una API
    desplegada. Las altas nuevas usan un expediente único de tres páginas; los cuerpos
    públicos nunca aceptan C1, C2 crudo, catálogo, prompts, PDF, PII ni envelopes internos Bedrock.
servers:
  - url: /api/v2
security:
  - CognitoAccessToken: []
tags:
  - name: jardines
  - name: familias
  - name: genai
  - name: tracking
  - name: expediente
  - name: kpi
  - name: catalogo
paths:
  /jardines:
    get:
      tags: [jardines]
      operationId: listJardines
      x-required-scope: jardines:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/JardinListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/Throttled'}
  /jardines/{id}/familias:
    get:
      tags: [jardines]
      operationId: listFamiliasByJardin
      x-required-scope: familias:read
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/FamiliaListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/Throttled'}
  /familias/{id}:
    get:
      tags: [familias]
      operationId: getFamilia
      x-required-scope: familias:read
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/FamiliaDetailResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /familias/{id}/contexto:
    get:
      tags: [familias]
      operationId: getContextoFamilia
      description: Devuelve vista minimizada y cerrada; nunca C2 crudo ni identificadores civiles.
      x-required-scope: familias:read
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/FamiliaContextResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /familias/{id}/oportunidades:
    get:
      tags: [familias]
      operationId: listOportunidades
      x-required-scope: familias:read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: orden
          in: query
          schema: {type: string, enum: [prioridad, urgencia, beneficio], default: prioridad}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/OpportunityListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /familias/{id}/guion:
    post:
      tags: [genai]
      operationId: createGuion
      description: >-
        El cliente selecciona únicamente beneficios autorizados. El servidor carga C1/C2/C4,
        elige el prompt C4 y construye FamilyGenerationRequestV1 internamente.
      x-required-scope: genai:write
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FamilyGenerationPublicRequest'}
      responses:
        '200': {$ref: '#/components/responses/ScriptGenerationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /familias/{id}/mensaje:
    post:
      tags: [genai]
      operationId: createMensaje
      description: >-
        El cliente selecciona únicamente beneficios autorizados. El servidor carga C1/C2/C4,
        elige el prompt C4 y construye FamilyGenerationRequestV1 internamente.
      x-required-scope: genai:write
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FamilyGenerationPublicRequest'}
      responses:
        '200': {$ref: '#/components/responses/MessageGenerationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /familias/{id}/conversaciones:
    post:
      tags: [tracking]
      operationId: createConversacion
      x-required-scope: conversaciones:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConversationRequest'}
      responses:
        '201': {$ref: '#/components/responses/ConversationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /form-records:
    post:
      tags: [expediente]
      operationId: createFormRecord
      description: Crea un expediente sintético vacío de tres páginas. No crea ni evalúa una familia.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateFormRecordRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/FormRecordResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}:
    get:
      tags: [expediente]
      operationId: getFormRecord
      x-required-scope: familias:read
      parameters: [{$ref: '#/components/parameters/FormRecordId'}]
      responses:
        '200': {$ref: '#/components/responses/FormRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /form-records/{form_record_id}/stages/inscripcion-inicial:
    put:
      tags: [expediente]
      operationId: saveInitialRegistrationDraft
      description: Guarda solo respuestas C0 permitidas de páginas 1 y 2. UNKNOWN no lleva valor.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveInitialRegistrationDraftRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/FormRecordResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}/stages/inscripcion-inicial/completion:
    post:
      tags: [expediente]
      operationId: completeInitialRegistration
      description: Atestigua páginas 1 y 2. Falla cerrado hasta satisfacer reglas aprobadas; nunca acepta contenido documental.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CompleteInitialRegistrationRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/FormRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}/preevaluations:
    post:
      tags: [expediente]
      operationId: createPreevaluation
      description: Solo INSCRIPCION_INICIAL=COMPLETA habilita motor determinista; borrador o expediente funcionalmente vacío devuelve 409/422.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateEvaluationRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/FormEvaluationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}/evaluations/{evaluation_id}:
    get:
      tags: [expediente]
      operationId: getFormEvaluation
      x-required-scope: familias:read
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/EvaluationId'}]
      responses:
        '200': {$ref: '#/components/responses/FormEvaluationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /form-records/{form_record_id}/responses:
    patch:
      tags: [expediente]
      operationId: updateAllowedResponses
      description: Actualiza solo field_id permitidos; versiona el expediente y marca la evaluación previa STALE sin sobreescribir procedencia.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateResponsesRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/FormRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}/stages/matricula/enablement:
    post:
      tags: [expediente]
      operationId: enableEnrollmentStage
      description: Cambia página 3 a PENDIENTE solo mediante evento autorizado provisional pendiente de validación Integra.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EnableEnrollmentRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/FormRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}/stages/matricula:
    put:
      tags: [expediente]
      operationId: saveEnrollmentDraft
      description: Guarda respuestas permitidas de página 3 solo cuando MATRICULA=PENDIENTE.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveEnrollmentDraftRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/FormRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}/stages/matricula/completion:
    post:
      tags: [expediente]
      operationId: completeEnrollmentStage
      description: Exige página 3 habilitada y completa en el mismo expediente; omitirla impide MATRICULA=COMPLETA.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CompleteEnrollmentRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/FormRecordResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /form-records/{form_record_id}/reevaluations:
    post:
      tags: [expediente]
      operationId: createReevaluation
      description: Crea una evaluación versionada nueva tras cambios permitidos; conserva form_record_id y procedencia.
      x-required-scope: familias:write
      parameters: [{$ref: '#/components/parameters/FormRecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateReevaluationRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/FormEvaluationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /kpi:
    get:
      tags: [kpi]
      operationId: getKpi
      x-required-scope: kpi:read
      parameters:
        - name: nivel
          in: query
          required: true
          schema: {type: string, enum: [jardin, comuna, region, nacional]}
        - name: id
          in: query
          schema: {$ref: '#/components/schemas/Id'}
        - name: desde
          in: query
          schema: {type: string, format: date}
        - name: hasta
          in: query
          schema: {type: string, format: date}
      responses:
        '200': {$ref: '#/components/responses/KpiResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /asistente:
    post:
      tags: [genai]
      operationId: askCatalogAssistant
      description: >-
        El público envía solo una pregunta filtrable. El servidor recupera catálogo C4 y
        construye AssistantRequestV1 internamente. Elegibilidad individual no llama Bedrock.
      x-required-scope: asistente:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantPublicRequest'}
      responses:
        '200': {$ref: '#/components/responses/AssistantResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /catalogo/ingesta-afiche:
    post:
      tags: [catalogo]
      operationId: ingestSyntheticFlyer
      description: COULD. Solo asset sintético prepublicado; siempre queda pendiente de revisión humana.
      x-required-scope: catalogo:admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schemas/TextractFlyerRequestV1.schema.json'}
      responses:
        '200': {$ref: '#/components/responses/FlyerDraftResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    CognitoAccessToken:
      type: oauth2
      description: JWT de acceso Cognito; se rechaza token de identidad. Backend valida firma, iss, exp, nbf, token_use=access, client_id y scope.
      flows:
        authorizationCode:
          authorizationUrl: https://example.invalid/oauth2/authorize
          tokenUrl: https://example.invalid/oauth2/token
          scopes:
            jardines:read: Listar jardines autorizados
            familias:read: Leer familias del scope
            familias:write: Gestionar expediente sintético y evaluaciones
            genai:write: Generar guion o mensaje
            conversaciones:write: Registrar conversación
            kpi:read: Leer agregados autorizados
            asistente:write: Consultar catálogo
            catalogo:admin: Crear borrador de catálogo
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    FormRecordId:
      name: form_record_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/FormRecordId'}
    EvaluationId:
      name: evaluation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[A-Z0-9][A-Z0-9_-]*$'
    Hash:
      type: string
      pattern: '^[a-f0-9]{64}$'
    FormRecordId:
      type: string
      maxLength: 80
      pattern: '^FORM-SIM-[A-Z0-9_-]{1,60}$'
    EnvelopeMetadata:
      type: object
      additionalProperties: false
      required: [request_id, snapshot_id, eligibility_bundle_hash, content_bundle_hash, content_version]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 80}
        snapshot_id: {$ref: '#/components/schemas/Id'}
        eligibility_bundle_hash: {$ref: '#/components/schemas/Hash'}
        content_bundle_hash: {$ref: '#/components/schemas/Hash'}
        content_version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
    CompositionMember:
      type: object
      additionalProperties: false
      required: [role, age]
      properties:
        role: {type: string, enum: [ADULT_REFERENCE, CHILD, OTHER_ADULT]}
        age: {type: integer, minimum: 0, maximum: 120}
    SourceCitation:
      type: object
      additionalProperties: false
      required: [source_id, url]
      properties:
        source_id: {$ref: '#/components/schemas/Id'}
        url: {type: string, format: uri, pattern: '^https://'}
    TraceItem:
      type: object
      additionalProperties: false
      required: [rule_id, field, operator, result]
      properties:
        rule_id: {$ref: '#/components/schemas/Id'}
        field: {type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9_.-]+$'}
        operator: {type: string, enum: [EQ, LT, LTE, GT, GTE, IN, BETWEEN, ACTIVE_ON_DATE, RANGE_LOOKUP, REF_EQ, COUNT_REL_GTE, NOT_EXISTS_WITHIN]}
        result: {type: string, enum: [CUMPLE, NO_CUMPLE, INDETERMINADO]}
    BenefitResult:
      type: object
      additionalProperties: false
      required: [benefit_id, result, level, access_state, missing_codes, trace]
      properties:
        benefit_id: {$ref: '#/components/schemas/Id'}
        result: {type: string, enum: [SI, 'NO', INDETERMINADO, NO_APLICA]}
        level: {type: [string, 'null'], enum: [CONFIRMADO, PRELIMINAR, null]}
        access_state: {type: string, enum: [ASIGNADO, GESTION_EN_CURSO, GESTION_RECHAZADA, ELEGIBLE_SIN_ASIGNACION, SIN_CUPO, PENDIENTE_ANTECEDENTES, INDETERMINADO, NO_APLICA]}
        missing_codes:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: string, pattern: '^[a-z0-9_.-]+$', maxLength: 80}
        trace:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/TraceItem'}
      oneOf:
        - properties:
            result: {const: SI}
            level: {type: string, enum: [CONFIRMADO, PRELIMINAR]}
            access_state: {type: string, enum: [ASIGNADO, GESTION_EN_CURSO, GESTION_RECHAZADA, ELEGIBLE_SIN_ASIGNACION, SIN_CUPO, PENDIENTE_ANTECEDENTES]}
        - properties:
            result: {const: INDETERMINADO}
            level: {const: null}
            access_state: {const: INDETERMINADO}
        - properties:
            result: {type: string, enum: ['NO', NO_APLICA]}
            level: {const: null}
            access_state: {const: NO_APLICA}
    Opportunity:
      type: object
      additionalProperties: false
      required: [benefit_id, simple_title, result, level, access_state, urgency, benefit, vulnerability, score, position, estimated_annual_amount, benefit_estimated, action_type, why_first, missing_codes, suggested_questions, where_to_go, sources]
      properties:
        benefit_id: {$ref: '#/components/schemas/Id'}
        simple_title: {type: string, minLength: 1, maxLength: 100}
        result: {type: string, enum: [SI, INDETERMINADO]}
        level: {type: [string, 'null'], enum: [CONFIRMADO, PRELIMINAR, null]}
        access_state: {type: string, enum: [ASIGNADO, GESTION_EN_CURSO, GESTION_RECHAZADA, ELEGIBLE_SIN_ASIGNACION, SIN_CUPO, PENDIENTE_ANTECEDENTES, INDETERMINADO]}
        urgency: {type: number, minimum: 0, maximum: 1}
        benefit: {type: number, minimum: 0, maximum: 1}
        vulnerability: {type: number, minimum: 0, maximum: 1}
        score: {type: number, minimum: 0}
        position: {type: integer, minimum: 1, maximum: 20}
        estimated_annual_amount: {type: [number, 'null'], minimum: 0}
        benefit_estimated: {type: boolean}
        action_type: {type: string, enum: [FAMILY_ACTION, AUTOMATIC, FOLLOW_UP, ASK_FIRST]}
