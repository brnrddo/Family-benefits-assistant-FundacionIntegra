    Error429: {description: Límite de solicitudes, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error503: {description: Dependencia sin fallback seguro, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
