        meta: {$ref: '#/components/schemas/EnvelopeMetadata'}
        data: {$ref: '#/components/schemas/FamilyContextView'}
    ConversationEnvelope:
      type: object
      additionalProperties: false
      required: [meta, data]
      properties:
        meta: {$ref: '#/components/schemas/EnvelopeMetadata'}
        data: {$ref: '#/components/schemas/ConversationRecord'}
    PreevaluationEnvelope:
      type: object
      additionalProperties: false
      required: [meta, data]
      properties:
        meta: {$ref: '#/components/schemas/EnvelopeMetadata'}
