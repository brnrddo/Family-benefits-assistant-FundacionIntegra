    OpportunityListEnvelope:
      type: object
      additionalProperties: false
      required: [meta, items, next_cursor]
      properties:
        meta: {$ref: '#/components/schemas/EnvelopeMetadata'}
        items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Opportunity'}}
