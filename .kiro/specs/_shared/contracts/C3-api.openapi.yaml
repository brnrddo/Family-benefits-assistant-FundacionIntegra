      content: {application/json: {schema: {$ref: '#/components/schemas/AssistantEnvelope'}}}
    FlyerDraftResponse:
      description: Borrador sintético que exige revisión humana
      content: {application/json: {schema: {$ref: '#/components/schemas/FlyerDraftEnvelope'}}}
    BadRequest: {$ref: '#/components/responses/Error400'}
    Unauthorized: {$ref: '#/components/responses/Error401'}
    Forbidden: {$ref: '#/components/responses/Error403'}
    NotFound: {$ref: '#/components/responses/Error404'}
    Conflict: {$ref: '#/components/responses/Error409'}
    Unprocessable: {$ref: '#/components/responses/Error422'}
    Throttled: {$ref: '#/components/responses/Error429'}
    Unavailable: {$ref: '#/components/responses/Error503'}
    Error400: {description: JSON o MIME inválido, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error401: {description: Autenticación ausente o inválida, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error403: {description: Operación no permitida sobre recurso visible, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error404: {description: Recurso inexistente o fuera de scope, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error409: {description: Idempotencia, asset o snapshot en conflicto, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error422: {description: Semántica, schema o seguridad inválida, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error429: {description: Límite de solicitudes, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error503: {description: Dependencia sin fallback seguro, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
