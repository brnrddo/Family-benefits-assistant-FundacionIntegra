    Error401: {description: Autenticación ausente o inválida, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error403: {description: Operación no permitida sobre recurso visible, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
    Error404: {description: Recurso inexistente o fuera de scope, content: {application/json: {schema: {$ref: './schemas/ErrorResponse.schema.json'}}}}
