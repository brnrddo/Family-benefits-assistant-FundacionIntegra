      content: {application/json: {schema: {$ref: '#/components/schemas/FamiliaDetailEnvelope'}}}
    FamiliaContextResponse:
      description: Contexto familiar minimizado y cerrado
      content: {application/json: {schema: {$ref: '#/components/schemas/FamiliaContextEnvelope'}}}
    OpportunityListResponse:
      description: Oportunidades con U/B/V y posición deterministas
      content: {application/json: {schema: {$ref: '#/components/schemas/OpportunityListEnvelope'}}}
